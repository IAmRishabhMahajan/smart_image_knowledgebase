version: "3.8"

services:
  ollama_smart_image_knowledgebase:
    image: ollama/ollama
    container_name: ollama_smart_image_knowledgebase
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./start_ollama.sh:/start_ollama.sh
    entrypoint: ["/bin/bash", "/start_ollama.sh"]
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: spk_app
    depends_on:
      - redis
      - ollama_smart_image_knowledgebase
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://ollama_smart_image_knowledgebase:11434
      - VISION_MODEL=llava
      - CLIP_MODEL=ViT-B-32
      - CLIP_PRETRAINED=openai
      - PHOTOS_DIR=/app/data/photos
      - TRACKER_PATH=/app/vectorstore/tracker.json
      - IMAGE_EMBED_DIM=512
      - FACE_EMBED_DIM=512
      - FACE_SIM_THRESHOLD=0.60
    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore
      - ./src:/app/src
      - ./streamlit_app.py:/app/streamlit_app.py
    ports:
      - "8009:8000"
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  streamlit:
    build: .
    container_name: spk_streamlit
    depends_on:
      - app
    environment:
      - API_BASE=http://app:8000
      - PHOTOS_DIR=/app/data/photos
    volumes:
      - ./data:/app/data
      - ./streamlit_app.py:/app/streamlit_app.py
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped

volumes:
  ollama_models:
  redis_data:
